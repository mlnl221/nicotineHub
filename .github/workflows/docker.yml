name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    # Only run on: push to main (publish), tags, manual, or PR stage -> main (dry-run)
    # This prevents docker builds on feature PRs (perf, per 4e79f46) while still testing stage promotion
    if: github.event_name != 'pull_request' || (github.base_ref == 'main' && github.head_ref == 'stage')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: bridge
            dockerfile: apps/bridge/Dockerfile
            package: nicotinehub-bridge
          - image: web
            dockerfile: apps/web/Dockerfile
            package: nicotinehub-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mlnl221/${{ matrix.package }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.source=https://github.com/mlnl221/nicotineHub
            org.opencontainers.image.title=Nicotine Hub - ${{ matrix.image }}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TAG=${{ steps.meta.outputs.version }}
            BUILD_TAG=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
