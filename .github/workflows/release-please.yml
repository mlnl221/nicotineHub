name: Release Please

# Conventional Commits on main -> version-bump PR with changelog.
# Merging that PR creates tag vX.Y.Z + GitHub Release, which triggers
# docker.yml (semver publish to GHCR). Releases are cut from main only.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          target-branch: main
