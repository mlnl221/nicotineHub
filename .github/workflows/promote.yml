name: Promote stage → main

on:
  schedule:
    # Every Monday 02:00 UTC — promotion window
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if stage is ahead of main
        id: check
        run: |
          git fetch origin stage main
          ahead=$(git rev-list --count origin/main..origin/stage 2>/dev/null || echo 0)
          behind=$(git rev-list --count origin/stage..origin/main 2>/dev/null || echo 0)
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "stage ahead of main: $ahead, behind: $behind"
          if [ "$ahead" -eq 0 ]; then
            echo "No promotion needed — stage is not ahead"
          fi

      - name: Check for existing promotion PR
        if: steps.check.outputs.ahead != '0'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list --base main --head stage --state open --json number --jq 'length' 2>/dev/null || echo 0)
          echo "existing=$count" >> "$GITHUB_OUTPUT"
          echo "Existing open promotion PRs: $count"

      - name: Create promotion PR
        if: steps.check.outputs.ahead != '0' && steps.existing.outputs.existing == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure we have latest stage
          git fetch origin stage
          # Create PR stage -> main
          gh pr create \
            --base main \
            --head stage \
            --title "chore: promote stage → main" \
            --body "Automated promotion of \`stage\` to \`main\`.

          - Trigger: schedule (\`0 2 * * 1\` weekly) or manual \`workflow_dispatch\`
          - Merging this PR will trigger GHCR builds (\`docker.yml: push: main\`) → \`ghcr.io/mlnl221/nicotinehub-bridge|web:latest\` + \`sha-\` + \`semver\` on tags
          - Review, approve, and merge when ready. No docker images are built on merges to \`stage\` (dry-run only on PRs).

          > This PR was auto-generated by \`.github/workflows/promote.yml\`. Close if not needed."
          echo "Promotion PR created"
