# Example override — bridge ports are default in compose.yaml.
# This file is kept as a template for host network (UPnP) or custom ports.
#
# For host network (UPnP sees host LAN IP):
#   cp compose.override.example.yaml compose.override.yaml
#   # Then in compose.override.yaml set for bridge:
#   #   network_mode: host  # (and drop ports:)
#   docker compose up -d
#
# For Gluetun VPN: use compose.gluetun.yaml instead:
#   docker compose -f compose.yaml -f compose.gluetun.yaml up -d
# See docs/deployment.md#gluetun
#
# Host network example (UPnP works, no port remap):
services:
  bridge:
    network_mode: host
    # ports: (ignored under host network)
