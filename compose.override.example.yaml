# Example override — bridge ports are default in compose.yaml.
# This file is kept as a template for host network (UPnP) or custom ports.
#
# For host network (UPnP sees host LAN IP):
#   cp compose.override.example.yaml compose.override.yaml
#   # Then in compose.override.yaml set for bridge:
#   #   network_mode: host  # (and drop ports:)
#   docker compose up -d
#
# For self-recreating bridge (Settings → Network port change applies the Docker
# host mapping automatically, no manual `LISTEN_PORT=NEW docker compose up -d`):
#   # Then in compose.override.yaml set for bridge:
#   #   volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
#   #   environment: { ALLOW_CONTAINER_RESTART: "1" }
#   # (socket access is host-root-equivalent — trusted LAN hosts only; keep
#   # BRIDGE_TOKEN set. Linux + Docker Desktop/WSL both work; `network_mode: host`
#   # is Linux-only and ignores ports, so don't combine the two.)
#
# For extra media mounts, paste this block into compose.override.yaml
# (after `cp compose.override.example.yaml compose.override.yaml`).
# Any mounted path works for sharing, playback and metadata — no env change needed.
# Share /data/mediaLibrary/Orpheus or /media/500SSD/Orpheus verbatim in Settings → Shares:
# services:
#   bridge:
#     volumes:
#       - /home/magnus/Downloads/NicotineHub:/data/NicotineHub
#       - /media/500SSD:/media/500SSD:ro
#   worker:
#     volumes:
#       - /home/magnus/Downloads/NicotineHub:/data/NicotineHub
#       - /media/500SSD:/media/500SSD:ro
# Verify: /api/files/raw?path=/media/500SSD/<file>.flac returns 206 audio/flac.
#
# For a VPN-forwarded port (e.g. Proton VPN gives you 59412): the Soulseek
# server dials peers at the IP it saw on your server connection, so the
# bridge's outbound traffic must exit via the VPN IP and the host must forward
# the VPN port into the container. Easiest: set the port and recreate —
#   LISTEN_PORT=59412 docker compose up -d
# (compose.yaml interpolates LISTEN_PORT into env + host mapping, TCP+UDP).
# No override file needed — env wins and compose.yaml maps it TCP+UDP. Turn
# off UPnP remap reliance (Settings → Network → UPnP off — the manual forward
# already covers it). Then verify: Diagnostics → Network shows listenPort
# 59412, and the IP the server sees for you matches your VPN exit IP.
#
# For VPN with custom routing, add your own override file.
# Host network example (UPnP works, no port remap):
services:
  bridge:
    network_mode: host
    # ports: (ignored under host network)
