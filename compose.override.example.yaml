# Example override — host network is now default in compose.yaml.
# This file is kept for users who prefer bridge network (no host) or need a template.
#
# To use bridge network instead of host:
#   cp compose.override.example.yaml compose.override.yaml
#   # Then in compose.override.yaml set for bridge:
#   #   network_mode: bridge  # (or remove host) + uncomment ports
#   docker compose up -d
#
# For Gluetun VPN: DO NOT use host — use compose.gluetun.yaml instead:
#   docker compose -f compose.yaml -f compose.gluetun.yaml up -d
# See docs/deployment.md#gluetun
#
# Bridge network example (bridge 172.x — UPnP will fail, forward manually):
services:
  bridge:
    network_mode: bridge
    ports:
      - "8787:8787"
      - "${LISTEN_PORT:-49127}:${LISTEN_PORT:-49127}"
      - "${LISTEN_PORT:-49127}:${LISTEN_PORT:-49127}/udp"
    environment:
      LISTEN_PORT: "${LISTEN_PORT:-49127}"
      PORT: "8787"
