# Example override — bridge ports are default in compose.yaml.
# This file is kept as a template for host network (UPnP) or custom ports.
#
# For host network (UPnP sees host LAN IP):
#   cp compose.override.example.yaml compose.override.yaml
#   # Then in compose.override.yaml set for bridge:
#   #   network_mode: host  # (and drop ports:)
#   docker compose up -d
#
# For self-recreating bridge (Settings → Network port change applies the Docker
# host mapping automatically, no manual `LISTEN_PORT=NEW docker compose up -d`):
#   # Then in compose.override.yaml set for bridge:
#   #   volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
#   #   environment: { ALLOW_CONTAINER_RESTART: "1" }
#   # (socket access is host-root-equivalent — trusted LAN hosts only; keep
#   # BRIDGE_TOKEN set. Linux + Docker Desktop/WSL both work; `network_mode: host`
#   # is Linux-only and ignores ports, so don't combine the two.)
#
# For extra media mounts, paste ONE of these blocks into compose.override.yaml
# (after `cp compose.override.example.yaml compose.override.yaml`):
#
# Pattern 1 — mount host folders into the /data tree (simplest, no env change).
# Share /data/NicotineHub and /data/mediaLibrary/Orpheus verbatim in Settings → Shares:
# services:
#   bridge:
#     volumes:
#       - /home/magnus/Downloads/NicotineHub:/data/NicotineHub
#       - /media/500SSD:/data/mediaLibrary:ro
#   worker:
#     volumes:
#       - /home/magnus/Downloads/NicotineHub:/data/NicotineHub
#       - /media/500SSD:/data/mediaLibrary:ro
#
# Pattern 2 — keep the host path as its own root (needs ALLOWED_ROOTS on BOTH services).
# Share /media/500SSD/Orpheus verbatim in Settings → Shares:
# services:
#   bridge:
#     volumes:
#       - /media/500SSD:/media/500SSD:ro
#     environment:
#       ALLOWED_ROOTS: "/data,/media"
#   worker:
#     volumes:
#       - /media/500SSD:/media/500SSD:ro
#     environment:
#       ALLOWED_ROOTS: "/data,/media"
# Verify: /health?json shows allowedRoots, and
# /api/files/raw?path=/media/500SSD/<file>.flac returns 206 audio/flac (not 403).
#
# For VPN with custom routing, add your own override file.
# Host network example (UPnP works, no port remap):
services:
  bridge:
    network_mode: host
    # ports: (ignored under host network)
