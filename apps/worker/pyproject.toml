[project]
name = "nicotine-hub-worker"
version = "0.25.0"
description = "Nicotine Hub worker — scrape/spectrum/tag (own code)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "aiohttp>=3.10",
  "beautifulsoup4[lxml]>=4.12",
  "mutagen>=1.45",
  "numpy>=1.26",
  "pydantic>=2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
