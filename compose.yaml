services:
  bridge:
    image: ghcr.io/mlnl221/nicotinehub-bridge:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/bridge/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      # Interpolated (not hardcoded) so env and the host mapping below always agree:
      # `LISTEN_PORT=NEW docker compose up -d` changes both. Env wins over the
      # persisted CONFIG_DIR/listen_port at boot (see apps/bridge/src/server.ts),
      # so a pinned value here would silently discard the UI-chosen port on recreate.
      LISTEN_PORT: "${LISTEN_PORT:-40598}"
      CONFIG_DIR: "/config"
      DATA_DIR: "/data"
      # Local preview roots for /api/files/raw (bridge) and tag/analyze/mediainfo/audio (worker).
      # Shares may live anywhere mounted (e.g. /media/500SSD:/media/500SSD → share /media/500SSD/Orpheus),
      # but playback/metadata only serve paths under these roots. Default is /data only.
      ALLOWED_ROOTS: "${ALLOWED_ROOTS:-/data}"
      BRIDGE_TOKEN: "${BRIDGE_TOKEN:-}"
      # Shares: Settings → Shares sends virtualName|hostPath pairs to the bridge via WS config:update.
      # Host paths must be mounted into the container to be scannable (e.g. /home/user/Music:/data/Music:ro).
      # You can also set SHARED_DIRS=/data/Music:/data/shared to auto-scan on startup.
      SHARED_DIRS: "${SHARED_DIRS:-}"
      # Homelab hardening: optionally restrict browser origins (e.g. ALLOWED_ORIGINS=https://hub.example.com,http://nas:3000)
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      # Opt-in companion to the socket mount above: ALLOW_CONTAINER_RESTART=1 lets the
      # bridge recreate itself after a UI port change (POST /restart, auto after Save).
      # ALLOW_CONTAINER_RESTART: "0"
    ports:
      # Browser traffic (WS /ws + HTTP) goes through the web entrypoint
      # (same-origin /ws + /api/bridge), so 8787 is NOT published — the
      # bridge lives on the compose network only. LISTEN_PORT below is
      # Soulseek peer traffic and MUST stay published TCP+UDP.
      - "${LISTEN_PORT:-40598}:${LISTEN_PORT:-40598}"
      - "${LISTEN_PORT:-40598}:${LISTEN_PORT:-40598}/udp"
    # Homelab: browsers reach the bridge through the web entrypoint only
    # (same-origin /ws + /api/bridge via proxy-server.js) — no 8787 publish.
    # LISTEN_PORT is the host port — changing it in Settings → Network (portrange) writes CONFIG_DIR/listen_port (+ CONFIG_DIR/host.env for .env sync) and hot-swaps Bun.listen + reconnects Soulseek (SetWaitPort) without WS restart; UI stays up, Save triggers fresh connect. The *host* mapping is static at create time — with the socket mount below it self-recreates, otherwise `LISTEN_PORT=NEW docker compose up -d` to change it.
    # UPnP auto-maps if `server.upnp` is enabled (default true, toggle in Network) but sees the container IP in bridge mode — prefer manual forward, or add `network_mode: host` (then drop `ports:`) so UPnP sees the host LAN IP.
    # Direct bridge access (remote setups): publish 8787 and set NEXT_PUBLIC_BRIDGE_URL=ws://host:8787/ws via web env.
    volumes:
      - config:/config
      - data:/data
      # Opt-in self-recreate via Docker socket: with this mounted + ALLOW_CONTAINER_RESTART=1,
      # a Settings → Network port change recreates the bridge container with the new
      # host mapping automatically (container ports are immutable at runtime — plain
      # `docker restart` keeps the old mapping). Socket access is host-root-equivalent:
      # only enable on trusted LAN hosts (see SECURITY.md). Not needed with
      # network_mode: host or when you run `LISTEN_PORT=NEW docker compose up -d` manually.
      # - /var/run/docker.sock:/var/run/docker.sock
      # Example host mounts for real file sharing (uncomment and adjust).
      # Pattern 1 — everything under /data (no ALLOWED_ROOTS change needed;
      # playback/metadata in /files work out of the box):
      # - /home/user/Downloads/NicotineHub:/data/NicotineHub
      # - /media/500SSD:/data/mediaLibrary:ro
      # → then share /data/NicotineHub and /data/mediaLibrary/Orpheus verbatim
      # in Settings → Shares (Browse container stores the path as-is).
      # Pattern 2 — separate root outside /data (e.g. keep the host path):
      # - /media/500SSD:/media/500SSD:ro
      # → set ALLOWED_ROOTS=/data,/media (bridge AND worker, same value) or
      # /files playback + worker tag/analyze stay 404 outside /data.
      # - /home/user/Music:/data/Music:ro
      # - /home/user/Downloads:/data/downloads:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    image: ghcr.io/mlnl221/nicotinehub-worker:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      CONFIG_DIR: "/config"
      DATA_DIR: "/data"
      # Must match bridge ALLOWED_ROOTS so /files playback + worker tag/analyze agree.
      ALLOWED_ROOTS: "${ALLOWED_ROOTS:-/data}"
      SPECTRUM_DIR: "/tmp/spectrals"
      WORKER_TOKEN: "${WORKER_TOKEN:-}"
      # Optional per-service scraper tokens (env first; see apps/worker for names)
      DISCOGS_TOKEN: "${DISCOGS_TOKEN:-}"
      QOBUZ_APP_ID: "${QOBUZ_APP_ID:-}"
      QOBUZ_USER_AUTH_TOKEN: "${QOBUZ_USER_AUTH_TOKEN:-}"
      TIDAL_TOKEN: "${TIDAL_TOKEN:-}"
      TIDAL_COUNTRY: "${TIDAL_COUNTRY:-US}"
    # No published ports: browsers reach the worker through the web
    # entrypoint (same-origin /api/worker). Direct access (remote setups):
    # add `8789:8789` and set NEXT_PUBLIC_WORKER_URL=http://host:8789.
    volumes:
      - config:/config:ro
      - data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8789/health"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    image: ghcr.io/mlnl221/nicotinehub-web:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # Service targets default to compose DNS in the web Dockerfile
      # (BRIDGE_INTERNAL_URL=http://bridge:8787, WORKER_INTERNAL_URL=http://worker:8789).
      # Leave NEXT_PUBLIC_* unset for same-origin proxying; set them only
      # for direct remote-service access (baked at build time).
      NEXT_PUBLIC_WORKER_URL: "${NEXT_PUBLIC_WORKER_URL:-}"
      # Server-side proxy auth fallback (browser Bearer is forwarded first).
      BRIDGE_TOKEN: "${BRIDGE_TOKEN:-}"
      WORKER_TOKEN: "${WORKER_TOKEN:-}"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  config:
  data:
