services:
  bridge:
    image: ghcr.io/mlnl221/nicotinehub-bridge:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/bridge/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      LISTEN_PORT: "60754"
      DATA_DIR: "/data"
      BRIDGE_TOKEN: "${BRIDGE_TOKEN:-}"
      # Shares: Settings → Shares sends virtualName|hostPath pairs to the bridge via WS config:update.
      # Host paths must be mounted into the container to be scannable (e.g. /home/user/Music:/data/Music:ro).
      # You can also set SHARED_DIRS=/data/Music:/data/shared to auto-scan on startup.
      SHARED_DIRS: "${SHARED_DIRS:-}"
      SHARES_DIR: "${SHARES_DIR:-}"
      # Homelab hardening: optionally restrict browser origins (e.g. ALLOWED_ORIGINS=https://hub.example.com,http://nas:3000)
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
    ports:
      - "8787:8787"
      - "60754:60754"
      - "60754:60754/udp"
    # Homelab: bridge ports are published so the browser can ws://nas:8787/ws directly.
    # LISTEN_PORT is the host port — changing it in Settings → Network (portrange) writes DATA_DIR/listen_port (+ DATA_DIR/host.env for .env sync) and hot-swaps Bun.listen + reconnects Soulseek (SetWaitPort) without WS restart; UI stays up, Save triggers fresh connect. The *host* mapping is static at create time: `LISTEN_PORT=NEW docker compose up -d` to change it.
    # UPnP auto-maps if `server.upnp` is enabled (default true, toggle in Network) but sees the container IP in bridge mode — prefer manual forward, or add `network_mode: host` (then drop `ports:`) so UPnP sees the host LAN IP.
    # For reverse-proxy only (internal): services: { bridge: { ports: !["127.0.0.1:8787:8787"] } } and set NEXT_PUBLIC_BRIDGE_URL via web env.
    volumes:
      - bridge-data:/data
      # Example host mounts for real file sharing (uncomment and adjust):
      # - /home/user/Music:/data/Music:ro
      # - /home/user/Downloads:/data/downloads:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    image: ghcr.io/mlnl221/nicotinehub-worker:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: "/data"
      SPECTRUM_DIR: "/tmp/hub-spectrum"
      WORKER_TOKEN: "${WORKER_TOKEN:-}"
      # Optional per-service scraper tokens (env first; see apps/worker for names)
      DISCOGS_TOKEN: "${DISCOGS_TOKEN:-}"
      QOBUZ_APP_ID: "${QOBUZ_APP_ID:-}"
      QOBUZ_USER_AUTH_TOKEN: "${QOBUZ_USER_AUTH_TOKEN:-}"
      TIDAL_TOKEN: "${TIDAL_TOKEN:-}"
      TIDAL_COUNTRY: "${TIDAL_COUNTRY:-US}"
    ports:
      - "8789:8789"
    volumes:
      - bridge-data:/data:ro
      - spectrum-cache:/tmp/hub-spectrum
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8789/health"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    image: ghcr.io/mlnl221/nicotinehub-web:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_WORKER_URL: "${NEXT_PUBLIC_WORKER_URL:-http://localhost:8789}"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  bridge-data:
  spectrum-cache:
