services:
  bridge:
    build:
      context: .
      dockerfile: apps/bridge/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      LISTEN_PORT: "2234"
      DATA_DIR: "/data"
      BRIDGE_TOKEN: "${BRIDGE_TOKEN:-}"
    ports:
      - "8787:8787"
      - "2234:2234"
      - "2234:2234/udp"
    volumes:
      - bridge-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  bridge-data:

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
