services:
  bridge:
    image: ghcr.io/mlnl221/nicotinehub-bridge:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/bridge/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      LISTEN_PORT: "${LISTEN_PORT:-49127}"
      DATA_DIR: "/data"
      BRIDGE_TOKEN: "${BRIDGE_TOKEN:-}"
      # Shares: Settings → Shares sends virtualName|hostPath pairs to the bridge via WS config:update.
      # Host paths must be mounted into the container to be scannable (e.g. /home/user/Music:/data/Music:ro).
      # You can also set SHARED_DIRS=/data/Music:/data/shared to auto-scan on startup.
      SHARED_DIRS: "${SHARED_DIRS:-}"
      SHARES_DIR: "${SHARES_DIR:-}"
      # Homelab hardening: optionally restrict browser origins (e.g. ALLOWED_ORIGINS=https://hub.example.com,http://nas:3000)
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
    # Homelab: bridge stays host-exposed so browser can ws://nas:8787/ws directly.
    # LISTEN_PORT is also the host port — changing it in Settings → Network (portrange)
    # writes DATA_DIR/listen_port (+ DATA_DIR/host.env for .env sync) and hot-swaps Bun.listen
    # + reconnects Soulseek (SetWaitPort) without WS restart; UI stays up, Save triggers fresh connect.
    # UPnP/NAT-PMP auto-maps if `server.upnp` is enabled (default true, toggle in Network).
    # For VPN (static forward 49127) use `network_mode: host` (see compose.override.example.yaml)
    # to avoid Docker port remap – then no `docker compose up -d` needed. For bridge network,
    # host mapping still static at create time: `LISTEN_PORT=49127 docker compose up -d` or watcher script.
    # UPnP inside Docker bridge network may fail (container IP 172.x != host LAN IP) — use
    # `network_mode: host` for auto-mapping or forward manually. For reverse-proxy only (internal):
    #   services: { bridge: { ports: !["127.0.0.1:8787:8787"] } } and set NEXT_PUBLIC_BRIDGE_URL via web env.
    ports:
      - "8787:8787"
      - "${LISTEN_PORT:-49127}:${LISTEN_PORT:-49127}"
      - "${LISTEN_PORT:-49127}:${LISTEN_PORT:-49127}/udp"
    volumes:
      - bridge-data:/data
      # Example host mounts for real file sharing (uncomment and adjust):
      # - /home/user/Music:/data/Music:ro
      # - /home/user/Downloads:/data/downloads:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    image: ghcr.io/mlnl221/nicotinehub-web:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  bridge-data:
