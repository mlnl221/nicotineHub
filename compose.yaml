services:
  bridge:
    image: ghcr.io/mlnl221/nicotinehub-bridge:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/bridge/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      LISTEN_PORT: "${LISTEN_PORT:-62904}"
      DATA_DIR: "/data"
      BRIDGE_TOKEN: "${BRIDGE_TOKEN:-}"
      # Homelab hardening: optionally restrict browser origins (e.g. ALLOWED_ORIGINS=https://hub.example.com,http://nas:3000)
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
    # Homelab: bridge stays host-exposed so browser can ws://nas:8787/ws directly.
    # LISTEN_PORT is also the host port — changing it in Settings → Network (portrange)
    # writes DATA_DIR/listen_port and reconnects the bridge, but Docker needs a
    # recreate to update the host binding: set LISTEN_PORT env and `docker compose up -d`
    # (or use `LISTEN_PORT=12345 docker compose up -d`). For reverse-proxy only (internal):
    #   services: { bridge: { ports: !["127.0.0.1:8787:8787"] } } and set NEXT_PUBLIC_BRIDGE_URL via web env.
    ports:
      - "8787:8787"
      - "${LISTEN_PORT:-62904}:${LISTEN_PORT:-62904}"
      - "${LISTEN_PORT:-62904}:${LISTEN_PORT:-62904}/udp"
    volumes:
      - bridge-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    image: ghcr.io/mlnl221/nicotinehub-web:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  bridge-data:
