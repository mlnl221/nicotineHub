services:
  bridge:
    image: ghcr.io/mlnl221/nicotinehub-bridge:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/bridge/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      LISTEN_PORT: "${LISTEN_PORT:-49127}"
      DATA_DIR: "/data"
      BRIDGE_TOKEN: "${BRIDGE_TOKEN:-}"
      # Shares: Settings → Shares sends virtualName|hostPath pairs to the bridge via WS config:update.
      # Host paths must be mounted into the container to be scannable (e.g. /home/user/Music:/data/Music:ro).
      # You can also set SHARED_DIRS=/data/Music:/data/shared to auto-scan on startup.
      SHARED_DIRS: "${SHARED_DIRS:-}"
      SHARES_DIR: "${SHARES_DIR:-}"
      # Homelab hardening: optionally restrict browser origins (e.g. ALLOWED_ORIGINS=https://hub.example.com,http://nas:3000)
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
    network_mode: host # default: host network for UPnP/NAT-PMP + no port remap — Settings → Network hot-swaps Bun.listen + reconnects Soulseek without `docker compose up -d`. Remove this line if using Gluetun (see compose.gluetun.yaml)
    # Homelab: bridge stays host-exposed so browser can ws://nas:8787/ws directly (host mode binds directly to host 8787 + LISTEN_PORT).
    # LISTEN_PORT is the host port — changing it in Settings → Network (portrange) writes DATA_DIR/listen_port (+ DATA_DIR/host.env for .env sync) and hot-swaps Bun.listen + reconnects Soulseek (SetWaitPort) without WS restart; UI stays up, Save triggers fresh connect.
    # UPnP/NAT-PMP auto-maps if `server.upnp` is enabled (default true, toggle in Network). Host mode is required for UPnP to see host LAN IP (bridge 172.x fails).
    # For bridge network (no host), comment out `network_mode: host` and uncomment `ports` below — then host mapping is static at create time: `LISTEN_PORT=49127 docker compose up -d` or watcher script `./scripts/sync-listen-port.sh`.
    # For Gluetun users: DO NOT use `network_mode: host`. Use `compose.gluetun.yaml` (bridge → `network_mode: service:gluetun`) instead — host and gluetun networks conflict (see docs/deployment.md#gluetun).
    # For reverse-proxy only (internal): services: { bridge: { ports: !["127.0.0.1:8787:8787"] } } and set NEXT_PUBLIC_BRIDGE_URL via web env.
    # ports: (bridge mode — uncomment if not using host)
    #   - "8787:8787"
    #   - "${LISTEN_PORT:-49127}:${LISTEN_PORT:-49127}"
    #   - "${LISTEN_PORT:-49127}:${LISTEN_PORT:-49127}/udp"
    volumes:
      - bridge-data:/data
      # Example host mounts for real file sharing (uncomment and adjust):
      # - /home/user/Music:/data/Music:ro
      # - /home/user/Downloads:/data/downloads:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    image: ghcr.io/mlnl221/nicotinehub-web:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  bridge-data:
